name: Game Project Tests

# Builds the engine, then runs the engine tests (Tests/Engine), and generates, builds and runs C# and C++ game projects against it (Tests/GameProjects)
on:
  push:
    branches: [dev]
    paths-ignore: ['Documentation/**', '**.md']
  pull_request:
    branches: [dev]
    paths-ignore: ['Documentation/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-project-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CodeGen output is the same for every platform, so it is generated once (on Linux) and skipped in the build jobs.
  # The tool itself is native, so each platform builds it here, in parallel with the other platforms, and the test
  # jobs download it for the C++ games, which run it over their own headers.
  codegen:
    name: codegen (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, submodules: false }
          - { name: win-x64, os: windows-2025, submodules: recursive }
          - { name: macos-arm64, os: macos-15, submodules: recursive }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: ${{ matrix.submodules }}

      - name: Install dependencies
        if: matrix.name == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      # builds Build/hyperion-codegen first if it is missing, so the tool uploaded below is the one that generated the output
      - name: Run CodeGen
        if: matrix.name == 'linux-x64'
        run: |
          version="$(grep -oE '^RunCodeGen\([0-9]+ [0-9]+\)' Source/CMakeLists.txt | grep -oE '[0-9]+ [0-9]+')"
          if [ -z "$version" ]; then echo "RunCodeGen(<major> <minor>) not found in Source/CMakeLists.txt"; exit 1; fi
          bash Tools/Scripts/RunCodeGen.sh $version
          test -f Source/Generated/CodeGenOutput.inc
          test -f Build/hyperion-codegen

      - name: Build CodeGen tool
        if: matrix.name == 'macos-arm64'
        run: echo y | bash Tools/Scripts/BuildCodeGen.sh

      - name: Build CodeGen tool
        if: matrix.name == 'win-x64'
        shell: cmd
        run: |
          echo y| call Tools\Scripts\BuildCodeGen.bat
          if not exist Build\hyperion-codegen.exe exit /b 1

      - uses: actions/upload-artifact@v7
        if: matrix.name == 'linux-x64'
        with:
          name: codegen
          path: |
            Source/Generated
            Data/Scripts/Strata
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: codegen-tool-${{ matrix.name }}
          path: Build/hyperion-codegen*
          if-no-files-found: error

  test-linux:
    name: game project tests (linux-x64)
    needs: codegen
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v5
        with:
          name: codegen

      - uses: actions/download-artifact@v5
        with:
          name: codegen-tool-linux-x64
          path: Build

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libx11-dev libopenal-dev libvulkan-dev

      # the Linux SDK tarball ships headers and tools but no prebuilt loader, so libvulkan.so comes from libvulkan-dev
      - name: Install Vulkan SDK
        timeout-minutes: 15
        run: |
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --speed-limit 100000 --speed-time 30 https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz -o "$RUNNER_TEMP/vulkan_sdk.tar.xz"
          mkdir -p "$RUNNER_TEMP/VulkanSDK"
          tar -xJf "$RUNNER_TEMP/vulkan_sdk.tar.xz" -C "$RUNNER_TEMP/VulkanSDK"
          sdk="$(find "$RUNNER_TEMP/VulkanSDK" -mindepth 2 -maxdepth 2 -type d -name x86_64 | sort -r | head -n 1)"
          if [ -z "$sdk" ]; then echo "Vulkan SDK was not extracted under $RUNNER_TEMP/VulkanSDK"; exit 1; fi
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Build engine
        env:
          HYP_BUILD_JOBS: 4
          HYP_SKIP_CODEGEN: 1
        run: |
          bash Tools/Scripts/BuildHyperion.sh Release ninja regenerate
          test -f Binaries/Linux/Release/libhyperion.so
          test -f Binaries/Linux/Release/Sdk/CMake/HyperionSdk.cmake

      # the static shipping engine the packaging tests link games against, as Package Game does
      - name: Build shipping SDK
        env:
          HYP_BUILD_JOBS: 4
          HYP_SKIP_CODEGEN: 1
        run: |
          bash Tools/Scripts/BuildHyperion.sh ninja sdk regenerate
          test -f Binaries/Linux/ShippingSdk/Sdk/StaticLibraries.txt

      # artifacts don't keep the executable bit
      - name: Make CodeGen tool executable
        run: chmod +x Build/hyperion-codegen

      # the engine tests need no game project, so they run first and report in seconds
      - name: Run engine tests
        env:
          HYPERION_BIN_DIR: ${{ github.workspace }}/Binaries/Linux/Release
        run: >
          dotnet test Tests/GameProjects/Runner/GameProjectTests.csproj
          --filter "FullyQualifiedName~Hyperion.GameProjectTests.EngineTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=engine-tests.trx"
          --results-directory Build/GameProjectTests/EngineTestResults

      # the game projects run headless, so no GPU or display is needed
      - name: Run game project tests
        if: ${{ !cancelled() }}
        env:
          HYPERION_BIN_DIR: ${{ github.workspace }}/Binaries/Linux/Release
        run: >
          dotnet test Tests/GameProjects/Runner/GameProjectTests.csproj
          --filter "FullyQualifiedName!~Hyperion.GameProjectTests.EngineTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=game-project-tests.trx"
          --results-directory Build/GameProjectTests/TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-project-tests-linux-x64
          path: |
            Build/GameProjectTests/TestResults
            Build/GameProjectTests/EngineTestResults
            Build/GameProjectTests/*/Logs
          if-no-files-found: ignore

  test-windows:
    name: game project tests (win-x64)
    needs: codegen
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v5
        with:
          name: codegen

      - uses: actions/download-artifact@v5
        with:
          name: codegen-tool-win-x64
          path: Build

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV'

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-tests-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'Source/vcpkg.json', 'Tools/vcpkg/**') }}

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe -OutFile $env:RUNNER_TEMP/vulkan_sdk.exe
          & $env:RUNNER_TEMP/vulkan_sdk.exe --accept-licenses --default-answer --confirm-command install | Out-Host
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK was not installed under C:\VulkanSDK" }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV

      - name: Build engine
        shell: cmd
        env:
          HYP_SKIP_CODEGEN: 1
        run: |
          Tools\Scripts\BuildHyperion.bat Release ninja regenerate
          if not exist Binaries\Windows\Release\hyperion.dll exit /b 1
          if not exist Binaries\Windows\Release\Sdk\CMake\HyperionSdk.cmake exit /b 1

      # the static shipping engine the packaging tests link games against, as Package Game does
      - name: Build shipping SDK
        shell: cmd
        env:
          HYP_SKIP_CODEGEN: 1
        run: |
          Tools\Scripts\BuildHyperion.bat Release ninja sdk regenerate
          if not exist Binaries\Windows\ShippingSdk\Sdk\StaticLibraries.txt exit /b 1

      # the engine tests need no game project, so they run first and report in seconds
      - name: Run engine tests
        shell: pwsh
        env:
          HYPERION_BIN_DIR: ${{ github.workspace }}\Binaries\Windows\Release
        run: >
          dotnet test Tests/GameProjects/Runner/GameProjectTests.csproj
          --filter "FullyQualifiedName~Hyperion.GameProjectTests.EngineTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=engine-tests.trx"
          --results-directory Build/GameProjectTests/EngineTestResults

      - name: Run game project tests
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          HYPERION_BIN_DIR: ${{ github.workspace }}\Binaries\Windows\Release
        run: >
          dotnet test Tests/GameProjects/Runner/GameProjectTests.csproj
          --filter "FullyQualifiedName!~Hyperion.GameProjectTests.EngineTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=game-project-tests.trx"
          --results-directory Build/GameProjectTests/TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-project-tests-win-x64
          path: |
            Build/GameProjectTests/TestResults
            Build/GameProjectTests/EngineTestResults
            Build/GameProjectTests/*/Logs
          if-no-files-found: ignore

  test-macos:
    name: game project tests (macos-arm64)
    needs: codegen
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v5
        with:
          name: codegen

      - uses: actions/download-artifact@v5
        with:
          name: codegen-tool-macos-arm64
          path: Build

      - name: Install dependencies
        run: |
          brew install ninja molten-vk vulkan-headers vulkan-loader freetype
          echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"

      # the runner has 7 GB of memory, which 8 parallel compiles of the engine can exhaust
      - name: Build engine
        env:
          HYP_BUILD_JOBS: 4
          HYP_SKIP_CODEGEN: 1
        run: |
          bash Tools/Scripts/BuildHyperion.sh Release ninja regenerate
          test -f Binaries/Mac/Release/libhyperion.dylib
          test -f Binaries/Mac/Release/Sdk/CMake/HyperionSdk.cmake

      # the static shipping engine the packaging tests link games against, as Package Game does
      - name: Build shipping SDK
        env:
          HYP_BUILD_JOBS: 4
          HYP_SKIP_CODEGEN: 1
        run: |
          bash Tools/Scripts/BuildHyperion.sh ninja sdk regenerate
          test -f Binaries/Mac/ShippingSdk/Sdk/StaticLibraries.txt

      # artifacts don't keep the executable bit
      - name: Make CodeGen tool executable
        run: chmod +x Build/hyperion-codegen

      # the engine tests need no game project, so they run first and report in seconds
      - name: Run engine tests
        env:
          HYPERION_BIN_DIR: ${{ github.workspace }}/Binaries/Mac/Release
        run: >
          dotnet test Tests/GameProjects/Runner/GameProjectTests.csproj
          --filter "FullyQualifiedName~Hyperion.GameProjectTests.EngineTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=engine-tests.trx"
          --results-directory Build/GameProjectTests/EngineTestResults

      - name: Run game project tests
        if: ${{ !cancelled() }}
        env:
          HYPERION_BIN_DIR: ${{ github.workspace }}/Binaries/Mac/Release
        run: >
          dotnet test Tests/GameProjects/Runner/GameProjectTests.csproj
          --filter "FullyQualifiedName!~Hyperion.GameProjectTests.EngineTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=game-project-tests.trx"
          --results-directory Build/GameProjectTests/TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-project-tests-macos-arm64
          path: |
            Build/GameProjectTests/TestResults
            Build/GameProjectTests/EngineTestResults
            Build/GameProjectTests/*/Logs
          if-no-files-found: ignore
