name: Release Editor

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft-release:
        description: Create a draft GitHub release from the result
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.backend }})
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [dx12, vulkan]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read engine version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content Source/CMakeLists.txt -Raw
          $parts = foreach ($c in 'MAJOR', 'MINOR', 'PATCH') {
            if ($cmake -notmatch "set\(HYP_VERSION_$c\s+(\d+)\)") { throw "HYP_VERSION_$c not found" }
            $Matches[1]
          }
          $version = $parts -join '.'
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the engine version v$version in Source/CMakeLists.txt"
          }

      - name: Check generated editor icons are committed
        shell: pwsh
        run: |
          # embedded into the editor at build time; they are written by BuildEditorIconsCommandlet, which this build skips
          if (-not (Get-ChildItem Source/Editor/Managed/Assets/Icons/Generated -Filter *.png -ErrorAction SilentlyContinue)) {
            throw "Source/Editor/Managed/Assets/Icons/Generated has no icons"
          }

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV'

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('Tools/vcpkg/**', 'Tools/Scripts/InstallDistributionDependencies.bat') }}

      - name: Build static third-party libraries
        shell: cmd
        run: Tools\Scripts\InstallDistributionDependencies.bat

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe -OutFile $env:RUNNER_TEMP/vulkan_sdk.exe
          & $env:RUNNER_TEMP/vulkan_sdk.exe --accept-licenses --default-answer --confirm-command install | Out-Host
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK was not installed under C:\VulkanSDK" }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV

      - name: Build
        shell: cmd
        run: Tools\Scripts\BuildHyperion.bat Release ninja distribution ${{ matrix.backend }} regenerate

      - name: Package
        shell: pwsh
        run: |
          ./Tools/Scripts/PackageEditorWindows.ps1 -NoZip -Symbols -OutputDir "${{ github.workspace }}/Packaged/editor"
          New-Item -ItemType Directory Packaged/symbols | Out-Null
          Move-Item "Packaged/editor/Hyperion-Editor-${{ steps.version.outputs.version }}-win64-${{ matrix.backend }}-symbols" Packaged/symbols/

      - uses: actions/upload-artifact@v7
        with:
          name: Hyperion-Editor-${{ steps.version.outputs.version }}-win64-${{ matrix.backend }}
          path: Packaged/editor
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Symbols-${{ steps.version.outputs.version }}-win64-${{ matrix.backend }}
          path: Packaged/symbols
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.draft-release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # editor artifacts only (symbols stay on the workflow run); each holds one top-level folder named after it
      - uses: actions/download-artifact@v5
        with:
          pattern: Hyperion-Editor-*
          merge-multiple: true

      - name: Create archives
        run: |
          for dir in Hyperion-Editor-*/; do
            name="${dir%/}"
            zip -q -r "$name.zip" "$name"
          done

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          gh release create "$tag" *.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Hyperion Editor $VERSION (preview)" \
            --notes "No .NET install is needed to run the editor. C# scripting requires the .NET 10 SDK."
