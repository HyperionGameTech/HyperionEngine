name: Release Editor

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft-release:
        description: Create a draft GitHub release from the result
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read engine version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content Source/CMakeLists.txt -Raw
          $parts = foreach ($c in 'MAJOR', 'MINOR', 'PATCH') {
            if ($cmake -notmatch "set\(HYP_VERSION_$c\s+(\d+)\)") { throw "HYP_VERSION_$c not found" }
            $Matches[1]
          }
          $version = $parts -join '.'
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the engine version v$version in Source/CMakeLists.txt"
          }

      - name: Check generated editor icons are committed
        shell: pwsh
        run: |
          # embedded into the editor at build time; they are written by BuildEditorIconsCommandlet, which this build skips
          if (-not (Get-ChildItem Source/Editor/Managed/Assets/Icons/Generated -Filter *.png -ErrorAction SilentlyContinue)) {
            throw "Source/Editor/Managed/Assets/Icons/Generated has no icons"
          }

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV'

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('Tools/vcpkg/**', 'Tools/Scripts/InstallDistributionDependencies.bat') }}

      - name: Build static third-party libraries
        shell: cmd
        run: Tools\Scripts\InstallDistributionDependencies.bat

      - name: Build
        shell: cmd
        run: Tools\Scripts\BuildHyperion.bat Release ninja distribution regenerate

      - name: Package
        shell: pwsh
        run: |
          ./Tools/Scripts/PackageEditorWindows.ps1 -NoZip -Symbols -OutputDir "${{ github.workspace }}/Packaged/editor"
          New-Item -ItemType Directory Packaged/symbols | Out-Null
          Move-Item "Packaged/editor/Hyperion-Editor-${{ steps.version.outputs.version }}-win64-symbols" Packaged/symbols/

      - uses: actions/upload-artifact@v7
        with:
          name: Hyperion-Editor-${{ steps.version.outputs.version }}-win64
          path: Packaged/editor
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Hyperion-Editor-${{ steps.version.outputs.version }}-win64-symbols
          path: Packaged/symbols
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.draft-release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Hyperion-Editor-${{ needs.build.outputs.version }}-win64

      - uses: actions/download-artifact@v5
        with:
          name: Hyperion-Editor-${{ needs.build.outputs.version }}-win64-symbols

      - name: Create archives
        run: |
          name="Hyperion-Editor-$VERSION-win64"
          zip -q -r "$name.zip" "$name"
          zip -q -r "$name-symbols.zip" "$name-symbols"
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          gh release create "$tag" *.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Hyperion Editor $VERSION (preview)" \
            --notes "Requires the .NET 10 runtime,.NET 10 SDK for C# scripting."
