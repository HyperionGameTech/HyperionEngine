name: Release (Windows editor preview)


on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft-release:
        description: Create a draft GitHub release from the result
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read engine version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content Source/CMakeLists.txt -Raw
          $parts = foreach ($c in 'MAJOR', 'MINOR', 'PATCH') {
            if ($cmake -notmatch "set\(HYP_VERSION_$c\s+(\d+)\)") { throw "HYP_VERSION_$c not found" }
            $Matches[1]
          }
          $version = $parts -join '.'
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the engine version v$version in Source/CMakeLists.txt"
          }

      - name: Check generated editor icons are committed
        shell: pwsh
        run: |
          # embedded into the editor at build time; they are written by BuildEditorIconsCommandlet, which this build skips
          if (-not (Get-ChildItem Source/Editor/Managed/Assets/Icons/Generated -Filter *.png -ErrorAction SilentlyContinue)) {
            throw "Source/Editor/Managed/Assets/Icons/Generated has no icons"
          }

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV'

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('Tools/vcpkg/**', 'Tools/Scripts/InstallDistributionDependencies.bat') }}

      - name: Build static third-party libraries
        shell: cmd
        run: Tools\Scripts\InstallDistributionDependencies.bat

      - name: Build
        shell: cmd
        run: Tools\Scripts\BuildHyperion.bat Release ninja distribution regenerate

      - name: Package
        shell: pwsh
        run: ./Tools/Scripts/PackageEditorWindows.ps1 -Symbols -OutputDir "${{ github.workspace }}/Packaged"

      - name: Checksums
        shell: pwsh
        working-directory: Packaged
        run: |
          Get-ChildItem *.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: editor-preview
          path: |
            Packaged/*.zip
            Packaged/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.draft-release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: editor-preview

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          gh release create "$tag" *.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Hyperion Editor $VERSION (preview)" \
            --notes "Windows editor preview. Requires the .NET 10 runtime (the .NET 10 SDK for C# scripting). The binaries are not code signed, so Windows 11 machines with Smart App Control turned on will refuse to run it."
