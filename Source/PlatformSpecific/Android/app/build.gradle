apply plugin: 'com.android.application'

android {
    namespace 'com.hyperion.engine'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hyperion.engine'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.0+'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The blob storage pages under Cache/ (storage.Textures.bin, storage.Shaders.bin, ...)
    // are already-dense binary blobs and can be hundreds of MB to multiple GB each.
    // Deflate-compressing them blows well past the JVM heap (OOM in
    // CompressAssetsWorkAction) for no real size benefit - store them as-is instead.
    androidResources {
        noCompress += ['bin', 'toc']
    }

    sourceSets {
        main {
            // libhyperion.so and libc++_shared.so are staged here automatically
            // by the stageNativeLibs task before every build.
            jniLibs.srcDirs = ['src/main/jniLibs']

            // Engine packages are staged into assets/ by stagePackageAssets.
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
}

// stage native libs into jniLibs before the APK is built
def engineBinariesRoot = file('../../../../Binaries/Android')

// device on path
def pickEngineDir = {
    def candidates = [
        new File(engineBinariesRoot, 'Release'),
        new File(engineBinariesRoot, 'Debug'),
        engineBinariesRoot
    ]

    for (c in candidates) {
        if (c.exists()) {
            return c
        }
    }

    return engineBinariesRoot
}

def engineBinariesDir = pickEngineDir()

def jniLibsAbiDir     = file('src/main/jniLibs/arm64-v8a')

def resolvedNdkDir = android.ndkDirectory

def engineSoFiles = fileTree(engineBinariesDir).include('**/*.so')

tasks.register('stageNativeLibs') {
    description 'Copies all .so files from the engine binaries directory (plus libc++_shared.so) into jniLibs before the APK is assembled.'

    inputs.files engineSoFiles
    outputs.dir  jniLibsAbiDir

    def ndkDir = resolvedNdkDir

    doLast {
        jniLibsAbiDir.mkdirs()

        if (engineSoFiles.isEmpty()) {
            throw new GradleException(
                "No .so files found under:\n  ${engineBinariesDir.absolutePath}\n\n" +
                "Build the engine first: BuildHyperion.bat Android <Debug|Release>"
            )
        }

        engineSoFiles.each { soFile ->
            def relativePath = soFile.absolutePath.substring(engineBinariesDir.absolutePath.length() + 1)

            // strip any abi directory prefix so the final name is just the leaf .so filename
            // e.g. "arm64-v8a/libfoo.so" -> "libfoo.so"
            def segments = relativePath.replace('\\', '/').split('/')
            def leafName = segments[-1]

            java.nio.file.Files.copy(
                soFile.toPath(),
                new File(jniLibsAbiDir, leafName).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            logger.lifecycle("[hyperion] Staged ${leafName}")
        }

        if (ndkDir != null) {
            def hostOs = org.gradle.internal.os.OperatingSystem.current()
            def hostTag = hostOs.isWindows() ? 'windows-x86_64' :
                          hostOs.isMacOsX()  ? 'darwin-x86_64' : 'linux-x86_64'
            def libcppSo = new File(ndkDir, "toolchains/llvm/prebuilt/${hostTag}/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so")
            if (libcppSo.exists()) {
                java.nio.file.Files.copy(libcppSo.toPath(), new File(jniLibsAbiDir, 'libc++_shared.so').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.lifecycle("[hyperion] Staged libc++_shared.so")
            } else {
                logger.warn("[hyperion] libc++_shared.so not found at ${libcppSo}. Skipping.")
            }
        }
    }
}

// Stage a packaged build into assets/.
//
// Pass -PhypPackageDir=<path> to point at a folder produced by PackageBuildAndroid.bat and
// this task just mirrors that folder wholesale - that script is now the single place that
// knows how to assemble a package (cooked content, platform-resolved configs, fonts,
// scripts, noise data), instead of this task reaching into the repo root itself.
//
// Without it (e.g. `gradlew assembleDebug` from Android Studio, or DeployAndroid.bat), it
// falls back to staging just the config jsons directly from the repo so local iteration
// still has something to run against.
def baseConfigDir = file("../../../../Config")
def assetsDestDir = file('src/main/assets')
def hypPackageDir = project.findProperty('hypPackageDir')

// Copy only overlays files, it never removes ones that used to be here - without this,
// switching between package dirs (or between a packaged release and a plain assembleDebug)
// leaves stale Content/config files sitting alongside the new ones. This has to be a
// separate Delete task rather than a doFirst {} on the Copy task itself - calling
// project.delete() from an execution-time closure isn't supported under the configuration
// cache.
tasks.register('cleanPackageAssets', Delete) {
    delete assetsDestDir
}

tasks.register('stagePackageAssets', Copy) {
    description 'Stage Hyperion content into assets/'

    dependsOn 'cleanPackageAssets'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    if (hypPackageDir) {
        from(file(hypPackageDir))
    } else {
        from(baseConfigDir) {
            include '*.Android.json'
            rename '(.+)\\.Android\\.json$', '$1.json'
        }
        from(baseConfigDir) {
            include '*.json'
            exclude '*.Android.json'
            exclude '*.IOS.json'
            exclude '*.Windows.json'
            exclude '*.Mac.json'
            exclude '*.Linux.json'
        }
        from(baseConfigDir) {
            include 'Shaders.hmf'
        }
    }

    into assetsDestDir
}

preBuild.dependsOn 'stageNativeLibs', 'stagePackageAssets'

def validationLayerFilename = 'libVkLayer_khronos_validation.so'
def validationLayerDestFile  = new File(jniLibsAbiDir, validationLayerFilename)

tasks.register('stageValidationLayers') {
    description 'Copies libVkLayer_khronos_validation.so into jniLibs/arm64-v8a for Vulkan validation on Android debug builds.'

   def capturedProjectDir = projectDir
    def capturedNdkDir = resolvedNdkDir

    outputs.file validationLayerDestFile

    doLast {
        def candidates = []
        candidates << new File(capturedProjectDir, "../../../../External/ThirdParty/Binaries/Android/arm64-v8a/${validationLayerFilename}")

        def source = candidates.find { it.exists() }

        if (source) {
            jniLibsAbiDir.mkdirs()
            java.nio.file.Files.copy(
                source.toPath(),
                validationLayerDestFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            logger.lifecycle("[hyperion] Staged ${validationLayerFilename} from ${source.absolutePath}")
        } else {
            logger.warn(
                "Vulkan validation layers unavailable.\n" +
                "\n  Checked:\n" + candidates.collect { "    ${it.canonicalPath}" }.join('\n') + '\n' +
                "\n  Download the prebuilt arm64-v8a binary from:" +
                "\n    https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases" +
                "\n  and place it at:" +
                "\n    External/ThirdParty/Binaries/Android/arm64-v8a/${validationLayerFilename}\n"
            )
        }
    }
}

android.applicationVariants.all { variant ->
    def variantCapitalized = variant.name.capitalize()

    if (variant.buildType.debuggable) {
        tasks.named("pre${variantCapitalized}Build") {
            dependsOn 'stageValidationLayers'
        }
    } else {
        tasks.named("pre${variantCapitalized}Build") {
            doFirst {
                if (validationLayerDestFile.exists()) {
                    validationLayerDestFile.delete()
                    logger.lifecycle("[hyperion] Removed ${validationLayerFilename} from jniLibs (release build)")
                }
            }
        }
    }
}
