apply plugin: 'com.android.application'

android {
    namespace 'com.hyperion.engine'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hyperion.engine'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.0+'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // libhyperion.so and libc++_shared.so are staged here automatically
            // by the stageNativeLibs task before every build.
            jniLibs.srcDirs = ['src/main/jniLibs']

            // Engine packages are staged into assets/ by stagePackageAssets.
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
}

// stage native libs into jniLibs before the APK is built
def engineBinariesRoot = file('../../../../Binaries/Android')

// device on path
def pickEngineDir = {
    def candidates = [
        new File(engineBinariesRoot, 'Debug'),
        new File(engineBinariesRoot, 'Release'),
        engineBinariesRoot
    ]

    for (c in candidates) {
        if (c.exists()) {
            return c
        }
    }

    return engineBinariesRoot
}

def engineBinariesDir = pickEngineDir()

def jniLibsAbiDir     = file('src/main/jniLibs/arm64-v8a')

def resolvedNdkDir = android.ndkDirectory

tasks.register('stageNativeLibs') {
    description 'Copies libhyperion.so (and libc++_shared.so) into jniLibs before the APK is assembled.'

    def engineSo = new File(engineBinariesDir, 'libhyperion.so')
    inputs.file  engineSo
    outputs.dir  jniLibsAbiDir

    def ndkDir = resolvedNdkDir

    doLast {
        if (!engineSo.exists()) {
            throw new GradleException(
                "libhyperion.so not found at:\n  ${engineSo.absolutePath}\n\n" +
                "Build the engine first: BuildHyperion.bat Android <Debug|Release>"
            )
        }

        jniLibsAbiDir.mkdirs()
        java.nio.file.Files.copy(engineSo.toPath(), new File(jniLibsAbiDir, 'libhyperion.so').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("[hyperion] Staged libhyperion.so")

        if (ndkDir != null) {
            def hostOs = org.gradle.internal.os.OperatingSystem.current()
            def hostTag = hostOs.isWindows() ? 'windows-x86_64' :
                          hostOs.isMacOsX()  ? 'darwin-x86_64' : 'linux-x86_64'
            def libcppSo = new File(ndkDir, "toolchains/llvm/prebuilt/${hostTag}/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so")
            if (libcppSo.exists()) {
                java.nio.file.Files.copy(libcppSo.toPath(), new File(jniLibsAbiDir, 'libc++_shared.so').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.lifecycle("[hyperion] Staged libc++_shared.so")
            } else {
                logger.warn("[hyperion] libc++_shared.so not found at ${libcppSo}. Skipping.")
            }
        }
    }
}

// copy packages into assets dir.
// TODO: Copy Projects/*ProjectName*/ too?
def basePackagesDir   = file('../../../../Packages')
def baseConfigDir = file("../../../../Config")
// only for testing, in finished build we'll just use packages / blob storage.
def baseDataDir = file("../../../../Data")
// also just for testing, copying Shaders.ini to the assets folder - should prob go elsewhere.
def shadersIni = file("../../../../Source/Shaders/Shaders.ini")
def assetsDestDir = file('src/main/assets')

tasks.register('stagePackageAssets', Sync) {
    description 'Stage Hyperion AssetPackage manifests'

    // Engine package manifests and non-blob assets
    from(basePackagesDir) {
        // FOR TESTING - i've commented out the exclusion of .blob files,
        // so we can test as we currently aren't copying the large blob cache anywhere and can't use it.
        // for packaged builds, this should be re-enabled and we should ensure the blob cache is being copied.
        // we'll need a way to trim it down first as it can get huge and bloated.
        // exclude '**/*.blob'
    }

    from(baseConfigDir) {
        into new File('Config')
    }
    from(baseDataDir) {
        into new File('Data')
    }
    from(shadersIni) {
        into new File("Source/Shaders/Shaders.ini")
    }
    into assetsDestDir
}

preBuild.dependsOn 'stageNativeLibs', 'stagePackageAssets'
